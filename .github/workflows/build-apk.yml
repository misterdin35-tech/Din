name: Build and Publish Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug-apk:
    name: Build & Publish Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          set -euo pipefail
          java -version
          echo "JAVA_HOME=${JAVA_HOME:-<unset>}"
          VERSION_OUTPUT="$(java -version 2>&1 | head -n 1 || true)"
          RAW_VER="$(printf '%s' "$VERSION_OUTPUT" | sed -nE 's/.*version "([^"]+)".*/\1/p')"
          if [ -z "$RAW_VER" ]; then
            echo "::error::Unable to detect Java version from output: $VERSION_OUTPUT"
            exit 1
          fi
          if [[ "$RAW_VER" == 1.* ]]; then
            MAJOR_VER="$(printf '%s' "$RAW_VER" | cut -d. -f2)"
          else
            MAJOR_VER="$(printf '%s' "$RAW_VER" | cut -d. -f1 | sed -E 's/[^0-9].*$//')"
          fi
          if [ -z "$MAJOR_VER" ] || ! [[ "$MAJOR_VER" =~ ^[0-9]+$ ]]; then
            echo "::error::Unable to parse Java major version from: $RAW_VER"
            exit 1
          fi
          echo "Detected Java major version: $MAJOR_VER"
          if [ "$MAJOR_VER" -lt 17 ]; then
            echo "::error::Java 17 or newer is required, but detected Java $MAJOR_VER."
            exit 1
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          set -euo pipefail
          if [ -f "./debug.keystore" ]; then
            echo "Existing ./debug.keystore found; skipping generation."
          else
            KEYTOOL_BIN="${JAVA_HOME:-}/bin/keytool"
            if [ ! -x "$KEYTOOL_BIN" ]; then
              echo "::error::Java 17 keytool not found at '$KEYTOOL_BIN'."
              exit 1
            fi
            "$KEYTOOL_BIN" -genkeypair \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -noprompt
            if [ ! -f "./debug.keystore" ] || [ ! -s "./debug.keystore" ]; then
              echo "::error::Failed to generate temporary ./debug.keystore."
              exit 1
            fi
            echo "Temporary ./debug.keystore created successfully."
          fi

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        run: |
          set -euo pipefail
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -e "$EXPECTED_APK" ]; then
            echo "::error::Expected debug APK not found at $EXPECTED_APK"
            if [ -d "app/build/outputs/apk" ]; then
              echo "APK files found inside app/build/outputs/apk:"
              find app/build/outputs/apk -type f -name '*.apk' -print || true
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi
          if [ ! -f "$EXPECTED_APK" ]; then
            echo "::error::$EXPECTED_APK exists but is not a regular file."
            exit 1
          fi
          if [ ! -s "$EXPECTED_APK" ]; then
            echo "::error::$EXPECTED_APK exists but is empty."
            exit 1
          fi
          if [[ "$EXPECTED_APK" != *.apk ]]; then
            echo "::error::Expected file does not have .apk extension: $EXPECTED_APK"
            exit 1
          fi
          if [ "$EXPECTED_APK" != "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "::error::Unexpected APK path: $EXPECTED_APK"
            exit 1
          fi
          APK_BYTES="$(wc -c < "$EXPECTED_APK")"
          echo "Verified debug APK: $EXPECTED_APK (${APK_BYTES} bytes)"

      - name: Upload debug APK artifact
        id: upload_artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          set -euo pipefail
          SOURCE_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$SOURCE_APK" ] || [ ! -s "$SOURCE_APK" ]; then
            echo "::error::Verified debug APK is missing or empty at $SOURCE_APK"
            exit 1
          fi
          REPO_SLUG="${GITHUB_REPOSITORY##*/}"
          SANITIZED_REPO="$(printf '%s' "$REPO_SLUG" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9._-]+/-/g; s/-+/-/g; s/^-+//; s/-+$//')"
          if [ -z "$SANITIZED_REPO" ]; then
            SANITIZED_REPO="android-app"
          fi
          RELEASE_ASSET_NAME="${SANITIZED_REPO}-debug-build-${GITHUB_RUN_NUMBER}.apk"
          TEMP_ASSET_DIR="$(mktemp -d "${RUNNER_TEMP:-/tmp}/apk-release-XXXXXX")"
          RELEASE_ASSET_PATH="${TEMP_ASSET_DIR}/${RELEASE_ASSET_NAME}"
          cp -- "$SOURCE_APK" "$RELEASE_ASSET_PATH"
          if [ ! -f "$RELEASE_ASSET_PATH" ] || [ ! -s "$RELEASE_ASSET_PATH" ] || [[ "$RELEASE_ASSET_PATH" != *.apk ]]; then
            echo "::error::Prepared release asset is invalid: $RELEASE_ASSET_PATH"
            exit 1
          fi
          echo "asset_path=$RELEASE_ASSET_PATH" >> "$GITHUB_OUTPUT"
          echo "asset_name=$RELEASE_ASSET_NAME" >> "$GITHUB_OUTPUT"
          echo "Prepared release asset: $RELEASE_ASSET_NAME"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_PATH: ${{ steps.prepare_asset.outputs.asset_path }}
          ASSET_NAME: ${{ steps.prepare_asset.outputs.asset_name }}
        run: |
          set -euo pipefail
          if ! command -v gh >/dev/null 2>&1; then
            echo "::warning::GitHub CLI (gh) is unavailable; cannot publish GitHub Release."
            exit 1
          fi
          gh --version
          if [ -z "$ASSET_PATH" ] || [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ] || [[ "$ASSET_PATH" != *.apk ]]; then
            echo "::warning::Prepared release asset '$ASSET_PATH' is missing, empty, or not an .apk file."
            exit 1
          fi

          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"
          NOTES_FILE="$(mktemp "${RUNNER_TEMP:-/tmp}/release-notes-XXXXXX.md")"
          printf '%s\n' \
            "This is an automatically generated debug APK." \
            "" \
            "- **Built by:** GitHub Actions" \
            "- **GitHub Actions Run Number:** ${GITHUB_RUN_NUMBER}" \
            "- **GitHub Actions Run Attempt:** ${GITHUB_RUN_ATTEMPT}" \
            "- **Source Commit SHA:** ${GITHUB_SHA}" \
            "- **Usage:** Intended for testing only." \
            "- **Release Notice:** This APK is **not** a Play Store production release and is signed only with a temporary debug keystore." \
            > "$NOTES_FILE"

          gh release create "$RELEASE_TAG" \
            "$ASSET_PATH" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TITLE" \
            --notes-file "$NOTES_FILE" \
            --latest

      - name: Report APK download result
        if: ${{ always() && steps.upload_artifact.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_NAME: ${{ steps.prepare_asset.outputs.asset_name }}
          RELEASE_OUTCOME: ${{ steps.publish_release.outcome }}
        run: |
          set -euo pipefail
          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"

          if [ "$RELEASE_OUTCOME" = "success" ]; then
            RELEASE_JSON="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json tagName,name,url,assets)"
            VERIFIED_TAG="$(printf '%s' "$RELEASE_JSON" | jq -r '.tagName')"
            VERIFIED_TITLE="$(printf '%s' "$RELEASE_JSON" | jq -r '.name')"
            RELEASE_URL="$(printf '%s' "$RELEASE_JSON" | jq -r '.url')"
            VERIFIED_ASSET="$(printf '%s' "$RELEASE_JSON" | jq -r --arg name "$ASSET_NAME" '.assets[] | select(.name == $name) | .name' | head -n 1)"

            if [ -z "$VERIFIED_ASSET" ]; then
              echo "::warning::Release created, but expected asset '$ASSET_NAME' was not listed in release assets."
              VERIFIED_ASSET="$ASSET_NAME"
            fi

            echo "Release Tag: $VERIFIED_TAG"
            echo "Release Title: $VERIFIED_TITLE"
            echo "GitHub Release URL: $RELEASE_URL"
            echo "APK Asset Filename: $VERIFIED_ASSET"

            {
              echo "## Debug APK Build & GitHub Release Summary"
              echo ""
              echo "- **Release Tag:** \`${VERIFIED_TAG}\`"
              echo "- **Release Title:** ${VERIFIED_TITLE}"
              echo "- **Release URL:** ${RELEASE_URL}"
              echo "- **APK Asset Filename:** \`${VERIFIED_ASSET}\`"
              echo ""
              echo "The APK can be downloaded directly from the **Assets** section on the GitHub Release page."
              echo "The normal GitHub Actions artifact (\`app-debug-apk\`) is also available as a backup."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::GitHub Release publishing failed, but the debug APK build succeeded and the Actions artifact 'app-debug-apk' remains available."
            {
              echo "## Debug APK Build Summary (Release Publishing Warning)"
              echo ""
              echo "> **Warning:** GitHub Release publishing failed. No release URL was created."
              echo ""
              echo "- **APK Build Status:** Succeeded"
              echo "- **Backup Artifact:** Download \`app-debug-apk\` from the **Artifacts** section of this GitHub Actions workflow run."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
